<svg xmlns="http://www.w3.org/2000/svg" width="590" height="300" viewBox="0 0 590 300" role="img" aria-label="K8s Microservices: Flask microservices on Kubernetes with an NGINX gateway, PostgreSQL, a logging service and Prometheus monitoring."><title>K8s Microservices: Flask microservices on Kubernetes with an NGINX gateway, PostgreSQL, a logging service and Prometheus monitoring.</title><style>
.sans{font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;letter-spacing:1.2px;}
