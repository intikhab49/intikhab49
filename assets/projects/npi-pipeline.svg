<svg xmlns="http://www.w3.org/2000/svg" width="590" height="300" viewBox="0 0 590 300" role="img" aria-label="NPI Lead Pipeline: NPI Registry providers to practice websites to e-mails: resume-safe and scheduled on GitHub Actions with zero paid APIs."><title>NPI Lead Pipeline: NPI Registry providers to practice websites to e-mails: resume-safe and scheduled on GitHub Actions with zero paid APIs.</title><style>
.sans{font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;letter-spacing:1.2px;}
.fx{transform-box:fill-box;transform-origin:center;}
.blob{animation:float 14s ease-in-out infinite alternate;}
