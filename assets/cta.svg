<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Open to contract work: voice agents, RAG chatbots, LLM cost optimization, ML validation and automation"><title>Open to contract work: voice agents, RAG chatbots, LLM cost optimization, ML validation and automation</title><style>
.sans{font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;letter-spacing:1.2px;}
.fx{transform-box:fill-box;transform-origin:center;}
.blob{animation:float 14s ease-in-out infinite alternate;}
.b2{animation-duration:18s;animation-direction:alternate-reverse;} .b3{animation-duration:22s;}
@keyframes float{from{transform:translate(0,0) scale(1);} to{transform:translate(60px,-40px) scale(1.15);}}
.spin{animation:spin 16s linear infinite;} .rspin{animation:spin 24s linear infinite reverse;}
@keyframes spin{to{transform:rotate(360deg);}}
.eq{animation:eq 1.1s ease-in-out infinite alternate;transform-origin:center;transform-box:fill-box;}
@keyframes eq{from{transform:scaleY(.22);} to{transform:scaleY(1);}}
.pulse{animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.25;}}
.ring{animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center;}
@keyframes ring{from{transform:scale(.3);opacity:.9;} to{transform:scale(1.6);opacity:0;}}
.draw{stroke-dasharray:1;animation:draw 4.5s ease-out infinite backwards;}
@keyframes draw{0%{stroke-dashoffset:1;} 60%,100%{stroke-dashoffset:0;}}
.rot{opacity:0;animation:rot 15s infinite both;}
@keyframes rot{0%{opacity:0;transform:translateY(16px);} 3%,17%{opacity:1;transform:translateY(0);} 20%,100%{opacity:0;transform:translateY(-16px);}}
.move{animation:move 2.6s linear infinite;}
@keyframes move{from{transform:translateX(0);opacity:0;} 15%{opacity:1;} 85%{opacity:1;} to{transform:translateX(var(--dx,120px));opacity:0;}}
.drop{animation:drop 3s ease-out infinite both;}
@keyframes drop{0%{transform:translateY(-18px);opacity:0;} 20%,80%{transform:translateY(0);opacity:1;} 100%{opacity:0;}}
.scan{animation:scan 2.8s ease-in-out infinite alternate;}
@keyframes scan{from{transform:translateY(0);} to{transform:translateY(var(--dy,80px));}}
.shine{animation:shine 5s linear infinite;}
@keyframes shine{from{transform:translateX(-400px);} to{transform:translateX(1400px);}}
.enter{animation:enter .9s cubic-bezier(.2,.8,.2,1) both;}
@keyframes enter{from{transform:translateY(-14px);opacity:0;} to{transform:translateY(0);opacity:1;}}
.grow{animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:bottom;}
@keyframes grow{from{transform:scaleY(0);} to{transform:scaleY(1);}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;} .rot{opacity:0;} .r0{opacity:1;}}
</style><defs>
<linearGradient id="sun" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFB224"/><stop offset=".5" stop-color="#FF5C39"/><stop offset="1" stop-color="#FF3D9A"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB224" stop-opacity=".9"/><stop offset=".5" stop-color="#FF3D9A" stop-opacity=".35"/><stop offset="1" stop-color="#5B8CFF" stop-opacity=".8"/></linearGradient>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="46"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#26263D"/></pattern>
</defs><clipPath id="clip"><rect width="1200" height="190" rx="20"/></clipPath><g clip-path="url(#clip)"><rect width="1200" height="190" fill="#0A0A14"/><g filter="url(#blur)" opacity=".55"><circle class="blob" cx="144" cy="38" r="61" fill="#FF5C39"/><circle class="blob b2" cx="936" cy="162" r="57" fill="#5B8CFF"/><circle class="blob b3" cx="660" cy="19" r="42" fill="#FF3D9A"/></g><rect width="1200" height="190" fill="url(#dots)" opacity=".6"/>
<text x="56" y="80" class="sans" font-size="33" font-weight="800" fill="#F6F4FF">Got an AI system that's <tspan fill="url(#sun)">slow, expensive</tspan> or unreliable?</text>
<text x="58" y="122" class="sans" font-size="17" fill="#A3A1BE">Voice agents · RAG chatbots · LLM cost optimization · ML validation · automation</text>
<rect x="56" y="140" width="300" height="34" rx="17" fill="url(#sun)"/>
<text x="206" y="162" class="mono" font-size="12" font-weight="700" fill="#0A0A14" text-anchor="middle">OPEN TO CONTRACT WORK →</text>
<g transform="translate(1100 95)"><circle class="ring" r="44" fill="none" stroke="#A3F547" stroke-width="2"/><circle class="ring" style="animation-delay:1.2s" r="44" fill="none" stroke="#A3F547" stroke-width="2"/><circle r="30" fill="#A3F547" filter="url(#glow)"/>
<text y="5" class="mono" font-size="11" font-weight="700" fill="#0A0A14" text-anchor="middle">HIRE</text></g>
<rect class="shine" x="0" y="0" width="120" height="190" fill="#fff" opacity=".04" transform="skewX(-20)"/></g><rect x="1" y="1" width="1198" height="188" rx="19" fill="none" stroke="url(#edge)" stroke-width="1.5"/></svg>