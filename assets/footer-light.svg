<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="End of profile"><title>End of profile</title><style>
  .serif { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; fill: #17181A; }
  .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #6A6E66; letter-spacing: 1.5px; }
  .sig   { fill: #D2500A; }
  .sage  { fill: #4F6B4C; }
  .ink   { fill: #17181A; }
  .blink { animation: blink 1.6s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.15; } }
  .draw  { stroke-dasharray: 1; animation: draw 5.5s ease-out infinite backwards; }
  .draw2 { animation-delay: 0.6s; }
  @keyframes draw { 0% { stroke-dashoffset: 1; } 55% { stroke-dashoffset: 0; } 88% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  .scan  { animation: scan 5.5s linear infinite; }
  @keyframes scan { from { transform: translateX(0); } to { transform: translateX(364px); } }
  @media (prefers-reduced-motion: reduce) { .draw, .scan, .blink { animation: none; stroke-dashoffset: 0; } }
</style><rect width="1200" height="90" rx="14" fill="#F4F0E6"/><line x1="56" y1="45" x2="470" y2="45" stroke="#CFC6B2"/>
<text x="600" y="50" class="mono" font-size="12" text-anchor="middle"><tspan class="sig blink">●</tspan>  END OF TRANSMISSION</text>
<line x1="730" y1="45" x2="1144" y2="45" stroke="#CFC6B2"/></svg>