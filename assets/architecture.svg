 stroke="#26263D" stroke-width="1.5"/><circle class="move" style="--dx:36px;animation-delay:2.45s" cx="696" cy="255" r="3.5" fill="#FF3D9A" filter="url(#glow)"/><path d="M696 345 C714 345 714 309 732 309" fill="none" stroke="#26263D" stroke-width="1.5"/><circle class="move" style="--dx:36px;animation-delay:2.80s" cx="696" cy="327" r="3.5" fill="#FF3D9A" filter="url(#glow)"/><path d="M928 165 C946 165 946 165 964 165" fill="none" stroke="#26263D" stroke-width="1.5"/><circle class="move" style="--dx:36px;animation-delay:3.15s" cx="928" cy="165" r="3.5" fill="#B794FF" filter="url(#glow)"/><path d="M928 237 C946 237 946 237 964 237" fill="none" stroke="#26263D" stroke-width="1.5"/><circle class="move" style="--dx:36px;animation-delay:3.50s" cx="928" cy="237" r="3.5" fill="#B794FF" filter="url(#glow)"/><path d="M928 309 C946 309 946 309 964 309" fill="none" stroke="#26263D" stroke-width="1.5"/><circle class="move" style="--dx:36px;animation-delay:3.85s" cx="928" cy="309" r="3.5" fill="#B794FF" filter="url(#glow)"/><path d="M928 381 C946 381 946 381 964 381" fill="none" stroke="#26263D" stroke-width="1.5"/><circle class="move" style="--dx:36px;animation-delay:4.20s" cx="928" cy="381" r="3.5" fill="#B794FF" filter="url(#glow)"/><text x="36" y="46" class="mono" font-size="12" font-weight="700" fill="#FFB224">● REFERENCE ARCHITECTURE</text><text x="1164" y="46" class="mono" font-size="11" fill="#A3A1BE" text-anchor="end">HOW I DESIGN PRODUCTION AI SYSTEMS</text><text x="36" y="96" class="mono" font-size="12" font-weight="700" fill="#FF5C39">01 · CLIENTS</text><rect x="36" y="108" width="196" height="3" rx="1.5" fill="#FF5C39"/><rect x="36" y="140" width="196" height="50" rx="12" fill="#12121F" stroke="#FF5C39" stroke-opacity=".55"/><circle cx="56" cy="165" r="4" fill="#FF5C39"/><text x="70" y="170" class="sans" font-size="14" font-weight="600" fill="#F6F4FF">Web portals</text><rect x="36" y="212" width="196" height="50" rx="12" fill="#12121F" stroke="#FF5C39" stroke-opacity=".55"/><circle cx="56" cy="237" r="4" fill="#FF5C39"/><text x="70" y="242" class="sans" font-size="14" font-weight="600" fill="#F6F4FF">Phone · voice AI</text><rect x="36" y="284" width="196" height="50" rx="12" fill="#12121F" stroke="#FF5C39" stroke-opacity=".55"/><circle cx="56" cy="309" r="4" fill="#FF5C39"/><text x="70" y="314" class="sans" font-size="14" font-weight="600" fill="#F6F4FF">Slack · e-mail</text><rect x="36" y="356" width="196" height="50" rx="12" fill="#12121F" stroke="#FF5C39" stroke-opacity=".55"/><circle cx="56" cy="381" r="4" fill="#FF5C39"/><text x="70" y="386" class="sans" font-size="14" font-weight="600" fill="#F6F4FF">Mobile + partner APIs</text><text x="268" y="96" class="mono" font-size="12" font-weight="700" fill="#FFB224">02 · EDGE</text><rect x="268" y="108" width="196" height="3" rx="1.5" fill="#FFB224"/><rect x="268" y="176" width="196" height="50" rx="12" fill="#12121F" stroke="#FFB224" stroke-opacity=".55"/><circle cx="288" cy="201" r="4" fill="#FFB224"/><text x="302" y="206" class="sans" font-size="14" font-weight="600" fill="#F6F4FF">Cloudflare Workers</text><rect x="268" y="248" width="196" height="50" rx="12" fill="#12121F" stroke="#FFB224" stroke-opacity=".55"/><circle cx="288" cy="273" r="4" fill="#FFB224"/><text x="302" y="278" class="sans" font-size="14" font-weight="600" fill="#F6F4FF">BFF · httpOnly auth</text><rect x="268" y="320" width="196" height="50" rx="12" fill="#12121F" stroke="#FFB224" stroke-opacity=".55"/><circle cx="288" cy="345" r="4" fill="#FFB224"/><text x="302" y="350" class="sans" font-size="14" font-weight="600" fill="#F6F4FF">Webhook ingestion</text><text x="500" y="96" class="mono" font-size="12" font-weight="700" fill="#FF3D9A">03 · CORE SERVICES</text><rect x="500" y="108" width="196" height="3" rx="1.5" fill="#FF3D9A"/><rect x="500" y="176" width="196" height="50" rx="12" fill="#12121F" stroke="#FF3D9A" stroke-opacity=".55"/><circle cx="520" cy="201" r="4" fill="#FF3D9A"/><text x="534" y="206" class="sans" font-size="14" font-weight="600" fill="#F6F4FF">NestJS · FastAPI</text><rect x="500" y="248" width="196" height="50" rx="12" fill="#12121F" stroke="#FF3D9A" stroke-opacity=".55"/><circle cx="520" cy="273" r="4" fill="#FF3D9A"/><text x="534" y="278" class="sans" font-size="14" font-weight="600" fill="#F6F4FF">Job queue + workers</text><rect x="500" y="320" width="196" height="50" rx="12" fill="#12121F" stroke="#FF3D9A" stroke-opacity=".55"/><circle cx="520" cy="345" r="4" fill="#FF3D9A"/><text x="534" y="350" class="sans" font-size="14" font-weight="600" fill="#F6F4FF">n8n workflows</text><text x="732" y="96" class="mono" font-size="12" font-weight="700" fill="#B794FF">04 · INTELLIGENCE</text><rect x="732" y="108" width="196" height="3" rx="1.5" fill="#B794FF"/><rect x="732" y="140" width="196" height="50" rx="12" fill="#12121F" stroke="#B794FF" stroke-opacity=".55"/><circle cx="752" cy="165" r="4" fill="#B794FF"/><text x="766" y="170" class="sans" font-size="14" font-weight="600" fill="#F6F4FF">LLM router</text><rect x="732" y="212" width="196" height="50" rx="12" fill="#12121F" stroke="#B794FF" stroke-opacity=".55"/><circle cx="752" cy="237" r="4" fill="#B794FF"/><text x="766" y="242" class="sans" font-size="14" font-weight="600" fill="#F6F4FF">Claude · GPT-4o</text><rect x="732" y="284" width="196" height="50" rx="12" fill="#12121F" stroke="#B794FF" stroke-opacity=".55"/><circle cx="752" cy="309" r="4" fill="#B794FF"/><text x="766" y="314" class="sans" font-size="14" font-weight="600" fill="#F6F4FF">Small models first</text><rect x="732" y="356" width="196" height="50" rx="12" fill="#12121F" stroke="#B794FF" stroke-opacity=".55"/><circle cx="752" cy="381" r="4" fill="#B794FF"/><text x="766" y="386" class="sans" font-size="14" font-weight="600" fill="#F6F4FF">RAG · vector memory</text><text x="964" y="96" class="mono" font-size="12" font-weight="700" fill="#A3F547">05 · DATA + OPS</text><rect x="964" y="108" width="196" height="3" rx="1.5" fill="#A3F547"/><rect x="964" y="140" width="196" height="50" rx="12" fill="#12121F" stroke="#A3F547" stroke-opacity=".55"/><circle cx="984" cy="165" r="4" fill="#A3F547"/><text x="998" y="170" class="sans" font-size="14" font-weight="600" fill="#F6F4FF">Postgres · tenant RLS</text><rect x="964" y="212" width="196" height="50" rx="12" fill="#12121F" stroke="#A3F547" stroke-opacity=".55"/><circle cx="984" cy="237" r="4" fill="#A3F547"/><text x="998" y="242" class="sans" font-size="14" font-weight="600" fill="#F6F4FF">Encrypted PII fields</text><rect x="964" y="284" width="196" height="50" rx="12" fill="#12121F" stroke="#A3F547" stroke-opacity=".55"/><circle cx="984" cy="309" r="4" fill="#A3F547"/><text x="998" y="314" class="sans" font-size="14" font-weight="600" fill="#F6F4FF">Object storage</text><rect x="964" y="356" width="196" height="50" rx="12" fill="#12121F" stroke="#A3F547" stroke-opacity=".55"/><circle cx="984" cy="381" r="4" fill="#A3F547"/><text x="998" y="386" class="sans" font-size="14" font-weight="600" fill="#F6F4FF">Prometheus · CI/CD</text><rect x="36" y="420" width="1128" height="56" rx="14" fill="#12121F" stroke="#26263D"/><text x="60" y="454" class="mono" font-size="12" fill="#A3A1BE"><tspan fill="#B794FF">CROSS-CUTTING</tspan>   MULTI-TENANCY · IDEMPOTENCY + RETRIES · KEY ROTATION · AUDIT TRAILS · COST BUDGETS · E2E-GATED DEPLOYS</text></g><rect x="1" y="1" width="1198" height="498" rx="19" fill="none" stroke="url(#edge)" stroke-width="1.5"/></svg>